name: Android release bundle

# Signed release AAB for Play Console internal testing (plan
# signed-release-build, #670). Manual dispatch only: signing runs exclusively
# from CI secrets, so unsigned PR/fork builds keep working untouched.
# The owner uploads the artifact to Play Console (Test and release > Testing >
# Internal testing); that first upload is what makes App integrity — and the
# app-signing fingerprint for assetlinks.json — appear.

on:
  workflow_dispatch:
    inputs:
      version-name:
        description: "Display version name (e.g. 1.9.0)"
        required: false
        default: "1.9.0"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Deliberately NOT the repo-standard Node 20: Capacitor CLI 8
          # refuses to run below Node 22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same reason as the debug workflow: sync generates the
      # cordova-plugins gradle include and the runtime capacitor.config.json
      # carrying server.url into the bundle.
      - name: Sync Capacitor shell
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          # Capacitor's android library targets Java 21 — JDK 17 fails with
          # "invalid source release: 21".
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore lives only in repo secrets (owner-generated, owner-held)
      # and dies with the runner: decoded under android/app/ (gitignored) and
      # referenced by absolute path so no working-directory assumptions leak
      # into build.gradle.
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See plan signed-release-build for the owner setup steps."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/upload.keystore"

      - name: Build signed release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version-name }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
