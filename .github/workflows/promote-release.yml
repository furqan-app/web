name: Promote release to prod

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  issues: write
  repository-projects: write

jobs:
  promote-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest unpromoted release branch
        id: version
        run: |
          git fetch origin 'refs/heads/release/*:refs/remotes/origin/release/*' 'refs/heads/prod:refs/remotes/origin/prod'
          candidates=$(git branch -r --list 'origin/release/*' | sed 's#.*origin/release/##' | sort -t. -k1,1n -k2,2n -k3,3n -r)
          version=""
          for v in $candidates; do
            if ! git merge-base --is-ancestor "origin/release/$v" origin/prod; then
              version="$v"
              break
            fi
          done
          if [[ -z "$version" ]]; then
            echo "No release branch found that isn't already merged into prod." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Gather milestoned issues
        id: issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v${{ steps.version.outputs.version }}"
          mapfile -t issues < <(gh issue list --repo "${{ github.repository }}" --milestone "$version" --state all --json title,url -q '.[] | "- \(.title) (\(.url))"')
          {
            echo "body<<RELEASE_EOF"
            [[ ${#issues[@]} -gt 0 ]] && printf '%s\n' "${issues[@]}"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      # Dynamic values come in through `env:` and are used as shell variables /
      # a body file — never interpolated into the script text, where a backtick
      # or $() in an issue title would run as a command (issue #534).
      - name: Open and auto-merge release → prod PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ steps.version.outputs.version }}
          RELEASE_BRANCH: release/${{ steps.version.outputs.version }}
          ISSUES_BODY: ${{ steps.issues.outputs.body }}
          REPO: ${{ github.repository }}
        run: |
          printf 'Promoting %s to prod.\n\n%s\n' "$VERSION" "$ISSUES_BODY" > "$RUNNER_TEMP/prod-pr-body.md"
          pr_url=$(gh pr create --repo "$REPO" --base prod --head "$RELEASE_BRANCH" --title "Release $VERSION" --body-file "$RUNNER_TEMP/prod-pr-body.md")
          # Merge directly instead of via --auto: GITHUB_TOKEN's enablePullRequestAutoMerge
          # call fails with "Resource not accessible by integration" unless auto-merge is
          # enabled repo-wide. Use a merge commit (not squash) so the release branch tip
          # stays an ancestor of prod — this workflow's own "is it already promoted" check
          # relies on that.
          gh pr merge "$pr_url" --repo "$REPO" --merge
          echo "### Promoting $VERSION to prod" >> "$GITHUB_STEP_SUMMARY"
          echo "PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Mark milestoned issues done and close them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v${{ steps.version.outputs.version }}"
          # Issues stay open through cut-release (stg); they close here, at prod.
          mapfile -t issues < <(gh issue list --repo "${{ github.repository }}" --milestone "$version" --state open --json number -q '.[].number')
          for n in "${issues[@]}"; do
            echo "Marking #$n as shipped in prod"
            gh issue edit "$n" --repo "${{ github.repository }}" \
              --remove-label "status:to-be-released" --add-label "status:done" || true
            gh issue close "$n" --repo "${{ github.repository }}" || true
          done
